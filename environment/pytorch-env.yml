name: calibration-pytorch
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.10
  - pytorch::pytorch::*=*cuda*
  - pytorch::pytorch-cuda=11.8
  - pytorch::torchvision
  - pytorch::torchaudio
  - conda-forge::numpy
  - conda-forge::scipy
  - conda-forge::pandas
  - conda-forge::matplotlib
  - conda-forge::biopython
  - pip
  - pip::jsonschema
  - pip::pyyaml
