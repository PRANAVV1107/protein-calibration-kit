benchmark_summary:
  total_targets: 4
  total_confirmed_binders: ~215
  total_confirmed_non_binders: ~80
  total_pairs_with_outcomes: ~295
  data_sources:
    - "Adaptyv Bio de novo design competitions (public data, ODC-ODbL licensed)"
    - "RFdiffusion validation campaigns (this project)"
  scoring_protocol:
    - "ColabFold AF2-multimer v3"
    - "Fast-screen settings: single-sequence (no MSA), 1 model, 3 recycles"
    - "Low-VRAM optimized: TF_FORCE_UNIFIED_MEMORY=1, XLA_PYTHON_CLIENT_MEM_FRACTION=4.0"
  notes: |
    - Outcome labels: 'true' = binding confirmed by wet-lab, 'false' = no binding detected, 'unknown' = not tested
    - ipTM metric is sensitive to chain size ratios (see RESEARCH_FINDINGS.md); calibration is target-specific
    - Calibration curve is fit on fast-screen scores; high-accuracy rescored designs will have different absolute scores
